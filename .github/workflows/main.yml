
name: Build Camera Security APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-33" "build-tools;33.0.2"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev patch

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Download CameraX provider
        run: |
          git clone https://github.com/Android-for-Python/camerax_provider.git

      - name: Create NumPy Android fix
        run: |
          mkdir -p p4a-recipes/numpy

          python - <<'PY'
          from pathlib import Path

          p = Path("p4a-recipes/numpy/__init__.py")
          p.write_text("""
          import os
          import sys

          for root, dirs, files in os.walk(".buildozer"):
              if os.path.isfile(os.path.join(root, "pythonforandroid", "recipes", "numpy", "__init__.py")):
                  sys.path.insert(0, root)
                  break

          from pythonforandroid.recipes.numpy import NumpyRecipe as UpstreamNumpyRecipe

          class NumpyRecipe(UpstreamNumpyRecipe):
              patches = ["unordered_map_include.patch"]

          recipe = NumpyRecipe()
          """)
          
          patch = Path("p4a-recipes/numpy/unordered_map_include.patch")
          patch.write_text("""--- a/numpy/_core/src/multiarray/unique.cpp
          +++ b/numpy/_core/src/multiarray/unique.cpp
          @@ -1,0 +1 @@
          +#include <unordered_map>
          """)
          PY

          if ! grep -q '^p4a.local_recipes' buildozer.spec; then
            sed -i '/^\[app\]/a p4a.local_recipes = ./p4a-recipes' buildozer.spec
          fi

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CameraSecurity-APK
          path: bin/*.apk
          if-no-files-found: error
